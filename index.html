<!DOCTYPE html>
<html>
  <head>
    <title>Itmas</title>
    <link rel="stylesheet" href="index.css">
    <script src="bundle.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
  </head>
  <body>
    <div id="content">
      <div id="picker-panel">
        <itmas-picker id="picker"></itmas-picker>
      </div>
      <div id="card">
        <div id="controls">
          <div id="top-left-panel">
            <div style="display: flex; flex-direction: row; gap: 15px;">
              <div id="buttons">
                <button id="clear">Clear</button>
                <button id="save">Save</button>
                <button id="open-dialog-button" type="button">Open</button>
                <button id="export">Export</button>
                <button id="export-mc">Export (MC)</button>
              </div>
              <input type="range" min="2" max="10" value="5" id="brush" orient="vertical"></input>
            </div>
            <div id="tool-row">
                 <button data-tool="Erase" title="Eraser"><img src="icons/eraser-solid-full.svg" alt="Eraser"></button>
                 <button data-tool="Fill" title="Paint Bucket"><img src="icons/fill-solid-full.svg" alt="Paint Bucket"></button>
                 <button data-tool="Square" title="Square Brush"><img src="icons/square-solid-full.svg" alt="Square Brush"></button>
                 <button data-tool="Circle" class="selected" title="Circle Brush"><img src="icons/circle-solid-full.svg" alt="Circle Brush"></button>
            </div>
          </div>
          <itmas-palette id="palette"></itmas-palette>
        </div>
        <div id="grid">
          <itmas-cloth id="side-view">
            <span slot="title">Side View</span>
          </itmas-cloth>
          <itmas-cloth id="top-view">
            <span slot="title">Top View</span>
          </itmas-cloth>
          <itmas-cloth id="front-view">
            <span slot="title">Front View</span>
          </itmas-cloth>
          <div id="three">
            <canvas id="three-canvas"></canvas>
            <span id="expand">&#x26F6;</span>
          </div>
        </div>
      </div>
      <div id="layers">
        <header>Layers</header>
        <itmas-layer layer="3"></itmas-layer>
        <itmas-layer layer="2"></itmas-layer>
        <itmas-layer layer="1"></itmas-layer>
        <itmas-layer class="selected" layer="0"></itmas-layer>
      </div>
    </div>
    <dialog id="open-dialog">
      <form method="dialog">
        <header>
          <h2>Open Model</h2>
          <button class="dialog-close" value="cancel" aria-label="Close">×</button>
        </header>
        <section id="saved-section">
          <h3>Saved Models</h3>
          <p class="empty-state" id="saved-empty">No saved models yet.</p>
          <div class="file-grid" id="saved-grid"></div>
        </section>
        <section id="examples-section">
          <h3>Examples</h3>
          <div class="file-grid" id="examples-grid"></div>
        </section>
        <section id="file-section">
          <h3>Import File</h3>
          <div style="display: flex; align-items: center; gap: 10px;">
            <input type="file" id="load" accept=".zip">
            <button id="load-file-button" type="button">Choose File</button>
            <span id="load-file-name" class="file-name">No file selected</span>
          </div>
        </section>
      </form>
    </dialog>
    <dialog id="save-dialog">
      <form method="dialog">
        <header>
          <h2>Save Model</h2>
          <button class="dialog-close" value="cancel" formnovalidate aria-label="Close">×</button>
        </header>
        <section class="save-dialog-body">
          <div class="save-preview">
            <img id="save-thumbnail" alt="Model preview">
          </div>
          <div class="save-fields">
            <label for="save-name">Model name</label>
            <input id="save-name" type="text" placeholder="My sculpture" required>
            <p class="help-text">You can rename this later in your saved list.</p>
          </div>
        </section>
        <footer class="dialog-actions">
          <button value="cancel" formnovalidate>Cancel</button>
          <button type="submit" id="save-dialog-confirm">Save</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>

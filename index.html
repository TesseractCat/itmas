<!DOCTYPE html>
<html>
  <head>
    <title>Itmas</title>
    <link rel="stylesheet" href="index.css">
    <script src="bundle.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
  </head>
  <body>
    <div id="content">
      <div id="picker-panel">
        <itmas-picker id="picker"></itmas-picker>
      </div>
      <div id="card">
        <div id="controls">
          <div id="top-left-panel">
            <div style="display: flex; flex-direction: row; gap: 15px;">
              <div id="buttons">
                <button id="clear">Clear</button>
                <button id="save">Save</button>
                <button id="export">Export</button>
                <input type="file" id="load"></input>
                <label for="load">Load</label>
              </div>
              <input type="range" min="2" max="10" value="5" id="brush" orient="vertical"></input>
            </div>
            <div id="tool-row">
              <button data-tool="Erase" title="Eraser">E</button>
              <button data-tool="Fill" title="Paint Bucket">B</button>
              <button data-tool="Square" title="Square Brush">◼</button>
              <button data-tool="Circle" class="selected" title="Circle Brush">⬤</button>
            </div>
          </div>
          <select id="examples">
            <option disabled selected value>Examples</option>
            <option value="truck">Truck</option>
            <option value="witch">Witch</option>
            <option value="skeleton">Skeleton</option>
            <option value="cat">Cat</option>
            <option value="frog">Frog</option>
          </select>
          <itmas-palette id="palette"></itmas-palette>
        </div>
        <div id="grid">
          <itmas-cloth id="side-view">
            <span slot="title">Side View</span>
          </itmas-cloth>
          <itmas-cloth id="top-view">
            <span slot="title">Top View</span>
          </itmas-cloth>
          <itmas-cloth id="front-view">
            <span slot="title">Front View</span>
          </itmas-cloth>
          <div id="three">
            <canvas id="three-canvas"></canvas>
            <span id="expand">&#x26F6;</span>
          </div>
        </div>
      </div>
      <div id="layers">
        <header>Layers</header>
        <itmas-layer layer="3"></itmas-layer>
        <itmas-layer layer="2"></itmas-layer>
        <itmas-layer layer="1"></itmas-layer>
        <itmas-layer class="selected" layer="0"></itmas-layer>
      </div>
    </div>
  </body>
</html>
